<!--
  public/images/growsave-cover.svg — Portada de GrowSave para la landing (3:2, 1200x800).
  Responsabilidad: imagen de featuredImage/media en content/pages/projects/growsave*.md.
  Identidad 2026-11 (repo TFM, app/frontend/tailwind.config.js): fondo «tinta», verde
  «brote» para el ahorro y dorado «meta» solo para la línea del objetivo. Dibuja el gráfico
  de la portada de GrowSave: banda de escenarios (P10–P90), mediana y la meta.
  Relación: el logo es una copia de Logo2 (repo TFM, app/frontend/components/ui/logo.tsx);
  si el logo cambia allí, hay que actualizarlo aquí. El contenido va centrado porque las
  tarjetas lo recortan con object-cover. Sin texto en un idioma: se usa en es y en.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A33"/>
      <stop offset="1" stop-color="#15352A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#fondo)"/>

  <!-- Banda de escenarios P10–P90 y mediana: el ahorro crece y se abre con el tiempo -->
  <path d="M0 720 C300 700 600 640 900 540 S1140 400 1200 340 L1200 600 C1100 640 900 690 600 715 S200 735 0 735 Z"
        fill="#2F6F57" fill-opacity="0.35"/>
  <path d="M0 728 C300 712 620 670 900 590 S1130 480 1200 450"
        fill="none" stroke="#8FBFA8" stroke-width="5" stroke-linecap="round"/>

  <!-- Meta: única línea dorada -->
  <line x1="0" y1="470" x2="1200" y2="470" stroke="#D9A42B" stroke-width="4" stroke-dasharray="18 12"/>

  <!-- Logo (Logo2) sobre tesela clara -->
  <g transform="translate(520 120)">
    <rect width="160" height="160" rx="36" fill="#F7F9F8"/>
    <g transform="translate(-10 -4) scale(1.68)">
      <rect x="25" y="55" width="10" height="15" rx="2" fill="#8FBFA8"/>
      <rect x="40" y="45" width="10" height="25" rx="2" fill="#4F9A7B"/>
      <rect x="55" y="35" width="10" height="35" rx="2" fill="#2F6F57"/>
      <path d="M75 30 L82 37 L78.5 37 L78.5 48 L71.5 48 L71.5 37 L68 37 Z" fill="#D9A42B"/>
    </g>
  </g>

  <text x="600" y="390" text-anchor="middle" fill="#F7F9F8"
        font-family="'Bricolage Grotesque', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700"
        letter-spacing="-2">GrowSave</text>
  <text x="600" y="440" text-anchor="middle" fill="#C6DDD1"
        font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="1">
    growsave.ylaguna.com
  </text>
</svg>
