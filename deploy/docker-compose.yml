# ============================================================================
# deploy/docker-compose.yml — Landing personal en el VPS
#
# Responsabilidad: ejecutar el contenedor `landing` (Next.js) y conectarlo a la
# red compartida `edge`, por la que entra el tráfico desde Caddy.
# Relación con otros módulos:
#   - Imagen: deploy/Dockerfile.
#   - Proxy: deploy/edge/ (Caddy compartido para todos los dominios *.ylaguna.com).
#   - No publica puertos: solo Caddy es accesible desde internet.
#
# Uso (desde la raíz del repo, en /opt/landing):
#   docker compose -f deploy/docker-compose.yml up -d --build
# ============================================================================

name: landing

services:
  landing:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Umami (deploy/analitica/): id del sitio "ylaguna.com" creado en el panel.
        # Exportar antes del build: UMAMI_ID_LANDING=<uuid> docker compose ... up -d --build
        NEXT_PUBLIC_UMAMI_URL: https://stats.ylaguna.com
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_ID_LANDING:-}
    image: landing-web:latest
    restart: unless-stopped
    networks:
      edge:
        aliases: [landing]

networks:
  edge:
    external: true
